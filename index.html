<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚗️ Potion Lab</title>
<style>

/* ===== RESET & CSS-VARIABLEN ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-dark:     #120820;
  --bg-mid:      #1e0f35;
  --bg-panel:    #2a1548;
  --accent-gold: #f0c040;
  --accent-purp: #8b5cf6;
  --text-light:  #e2d4f8;
  --text-muted:  #9070b0;
  --border:      #5b3490;
  --glow-purp:   0 0 14px rgba(139,92,246,0.45);
  --glow-gold:   0 0 14px rgba(240,192,64,0.55);
}

body {
  background: var(--bg-dark);
  color: var(--text-light);
  font-family: Georgia, 'Times New Roman', serif;
  min-height: 100vh;
}

/* ===== TOP-LEVEL LAYOUT ===== */
#game {
  max-width: 1120px;
  margin: 0 auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ===== HEADER ===== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, var(--bg-mid), var(--bg-panel));
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 10px 20px;
  box-shadow: var(--glow-purp);
}
header h1 {
  font-size: 1.7em;
  color: var(--accent-gold);
  text-shadow: 0 0 12px rgba(240,192,64,0.5);
  letter-spacing: 1px;
}
#btn-book {
  background: var(--bg-panel);
  border: 2px solid var(--accent-gold);
  color: var(--accent-gold);
  padding: 7px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95em;
  transition: all 0.2s;
}
#btn-book:hover { background: var(--accent-gold); color: var(--bg-dark); box-shadow: var(--glow-gold); }

/* ===== AUFTRAGSLEISTE ===== */
#quests {
  background: linear-gradient(135deg, #160a28, #221040);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
}
#quests h2 { font-size: 0.9em; color: var(--accent-gold); margin-bottom: 8px; }
#quest-list { display: flex; gap: 8px; flex-wrap: wrap; }

.quest-card {
  flex: 1;
  min-width: 150px;
  background: rgba(91,52,144,0.18);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 0.82em;
  transition: all 0.3s;
}
.quest-card.done { background: rgba(34,197,94,0.15); border-color: #22c55e; opacity: 0.65; }
.quest-card .q-title { font-weight: bold; color: var(--accent-gold); display: block; }
.quest-card .q-desc  { color: var(--text-muted); }

/* ===== HAUPT-3-SPALTEN ===== */
#main-area {
  display: grid;
  grid-template-columns: 200px 1fr 205px;
  gap: 10px;
  align-items: start;
}

/* ===== GEMEINSAMES PANEL ===== */
.panel {
  background: linear-gradient(180deg, var(--bg-mid), var(--bg-panel));
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  box-shadow: var(--glow-purp);
}
.panel h2 {
  font-size: 0.9em;
  color: var(--accent-gold);
  text-align: center;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* ===== ZUTATENKARTEN ===== */
.ing-card {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.28);
  border: 2px solid transparent;
  border-radius: 8px;
  padding: 7px 9px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.ing-card:hover:not(.ing-disabled) {
  background: rgba(139,92,246,0.2);
  border-color: var(--accent-purp);
  transform: translateX(3px);
}
.ing-card.ing-selected {
  background: rgba(240,192,64,0.12);
  border-color: var(--accent-gold);
  box-shadow: 0 0 8px rgba(240,192,64,0.35);
}
/* Gesperrt: Slots voll ODER gerade wird gebraut */
.ing-card.ing-disabled { opacity: 0.42; cursor: not-allowed; }
.ing-card.ing-disabled:hover { transform: none; border-color: transparent; background: rgba(0,0,0,0.28); }

.ing-icon { font-size: 1.5em; width: 32px; text-align: center; }
.ing-name { font-size: 0.88em; font-weight: bold; color: var(--text-light); display: block; }
.ing-tags { font-size: 0.68em; color: var(--text-muted); }

/* ===== KESSEL-MITTELPANEL ===== */
#center-panel { display: flex; flex-direction: column; align-items: center; gap: 12px; }

.lab-box {
  width: 100%;
  background:
    radial-gradient(ellipse at 50% 90%, rgba(91,52,144,0.25) 0%, transparent 70%),
    linear-gradient(180deg, #0e0618 0%, #180b2a 100%);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 16px 14px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--glow-purp);
}

/* Holzregal oben */
.lab-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 36px;
  background: repeating-linear-gradient(90deg, #251040 0px, #251040 28px, #180c30 28px, #180c30 32px);
  border-bottom: 4px solid #4a2072;
  z-index: 0;
}
/* Dekoration auf dem Regal */
.lab-box::after {
  content: '🕯️  🧿  🕯️';
  position: absolute;
  top: 3px; left: 0; right: 0;
  text-align: center;
  font-size: 1em;
  z-index: 1;
  pointer-events: none;
}

/* ===== CSS-KESSEL ===== */
.cauldron-wrap { position: relative; margin-top: 28px; z-index: 2; }

.cauldron-body {
  width: 110px;
  height: 76px;
  background: linear-gradient(145deg, #3a3355, #1a1228);
  border-radius: 10px 10px 44% 44%;
  border: 3px solid #5a4a80;
  position: relative;
  box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  animation: cauldron-float 3.2s ease-in-out infinite;
  transition: filter 0.4s;
}
/* Brewing-Zustand: Kessel leuchtet und wackelt */
.cauldron-body.brewing {
  filter: drop-shadow(0 0 20px rgba(180,100,255,0.9));
  animation: cauldron-brew 0.3s ease-in-out 6;
}

.cauldron-rim {
  position: absolute;
  top: -10px; left: -8px; right: -8px;
  height: 18px;
  background: linear-gradient(180deg, #6a5a90, #3a2a58);
  border-radius: 6px;
  border: 2px solid #7a6aaa;
}
.cauldron-liquid {
  position: absolute;
  bottom: 10px; left: 14px; right: 14px;
  height: 24px;
  border-radius: 50%;
  background: radial-gradient(ellipse, #c084fc, #7c3aed);
  /* Farbe wechselt per JS über inline-style */
  animation: liquid-bubble 1.8s ease-in-out infinite;
  transition: background 0.7s ease;
}
.cauldron-leg { position: absolute; bottom: -10px; width: 9px; height: 14px; background: #2a1a40; border-radius: 3px; }
.cauldron-leg.l { left: 18px; }
.cauldron-leg.r { right: 18px; }

/* Dampf */
.steam-row {
  position: absolute;
  top: -30px; left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
}
.steam-puff {
  width: 10px; height: 28px;
  background: radial-gradient(ellipse, rgba(180,140,255,0.5), transparent);
  border-radius: 50%;
  animation: steam-up 2.2s ease-out infinite;
  opacity: 0;
}
.steam-puff:nth-child(2) { animation-delay: 0.75s; }
.steam-puff:nth-child(3) { animation-delay: 1.5s; }

@keyframes cauldron-float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}
@keyframes cauldron-brew {
  0%,100% { transform: scale(1) rotate(0deg); }
  50%     { transform: scale(1.08) rotate(4deg); }
}
@keyframes liquid-bubble {
  0%,100% { transform: scaleY(1);    opacity: 0.85; }
  50%     { transform: scaleY(0.88); opacity: 1; }
}
@keyframes steam-up {
  0%   { opacity: 0.7; transform: translateY(0) scaleX(1); }
  100% { opacity: 0;   transform: translateY(-36px) scaleX(2.2); }
}

/* ===== ZUTATEN-SLOTS ===== */
#slots { display: flex; gap: 8px; z-index: 2; }

.slot {
  width: 58px; height: 58px;
  background: rgba(0,0,0,0.4);
  border: 2px dashed var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5em;
  position: relative;
  transition: all 0.2s;
}
.slot.filled {
  border-style: solid;
  border-color: var(--accent-gold);
  background: rgba(240,192,64,0.1);
  box-shadow: 0 0 8px rgba(240,192,64,0.35);
}
.slot .x-btn {
  position: absolute;
  top: -8px; right: -8px;
  background: #9f1212;
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 18px; height: 18px;
  font-size: 0.65em;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.slot.filled .x-btn { display: flex; }
/* Slots während des Brauens sperren */
.slot.locked .x-btn { display: none; cursor: default; }

/* ===== BRAUEN-BUTTON ===== */
#btn-brew {
  background: linear-gradient(135deg, #5b21b6, #8b5cf6);
  border: 2px solid var(--accent-gold);
  color: var(--accent-gold);
  padding: 11px 26px;
  border-radius: 10px;
  font-size: 1.05em;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.2s;
  box-shadow: var(--glow-purp);
  z-index: 2;
  min-width: 160px;
}
#btn-brew:hover:not(:disabled) {
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  box-shadow: var(--glow-gold), var(--glow-purp);
  transform: translateY(-2px);
}
#btn-brew:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

/* ===== TRANK-STATUS-ANZEIGE ===== */
#potion-info {
  min-height: 70px;
  width: 100%;
  text-align: center;
  padding: 8px 10px;
  background: rgba(0,0,0,0.28);
  border-radius: 10px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 1px solid transparent;
  transition: border-color 0.3s;
}
/* Hervorheben wenn Trank bereit zum Anwenden */
#potion-info.has-potion {
  border-color: var(--accent-gold);
  box-shadow: 0 0 10px rgba(240,192,64,0.2);
}
.p-idle   { color: var(--text-muted); font-style: italic; font-size: 0.84em; }
.p-ready  { color: #a0d0ff; font-size: 0.88em; }
.p-icon   { font-size: 2em; line-height: 1; }
.p-name   { font-size: 1em;   color: var(--accent-gold); font-weight: bold; }
.p-desc   { font-size: 0.78em; color: var(--text-muted); }
.p-hint   { font-size: 0.78em; color: #c084fc; animation: hint-blink 1.4s infinite; }
.p-brewing { color: #c084fc; font-size: 0.9em; animation: hint-blink 0.7s infinite; }

@keyframes hint-blink {
  0%,100% { opacity: 0.55; }
  50%      { opacity: 1; }
}

/* ===== ZIELKARTEN ===== */
.target-card {
  background: rgba(0,0,0,0.28);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 12px 10px;
  margin-bottom: 8px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.3s, background 0.3s, transform 0.2s, box-shadow 0.3s;
  position: relative;
  overflow: hidden;
}
.target-card:hover:not(.t-disabled) {
  border-color: var(--accent-purp);
  background: rgba(139,92,246,0.18);
  transform: scale(1.04);
}
.target-card.t-disabled { cursor: default; opacity: 0.75; }
.target-card.t-disabled:hover { transform: none; border-color: var(--border); background: rgba(0,0,0,0.28); }

.t-visual { font-size: 3em; display: block; margin-bottom: 4px; transition: filter 0.4s, transform 0.4s; }
.t-name   { font-size: 0.88em; font-weight: bold; }
.t-status { font-size: 0.73em; color: var(--text-muted); min-height: 15px; display: block; margin-top: 2px; }

/* ===== EFFEKT-KLASSEN FÜR ZIELKARTEN =====
   Jede Klasse setzt: Rahmenfarbe, Hintergrund, Filter/Animation auf .t-visual
   Kein !important nötig, da CSS-Spezifizität durch Klasse ausreicht.
   Effekte bestehen als permanenter Status, bis ein neuer Trank angewendet wird.
*/

/* Heiltrank */
.fx-healing { border-color: #22c55e; background: rgba(34,197,94,0.15); }
.fx-healing .t-visual { filter: drop-shadow(0 0 10px #22c55e); }

/* Feuertrank */
.fx-fire    { border-color: #ef4444; background: rgba(239,68,68,0.15); }
.fx-fire .t-visual { filter: drop-shadow(0 0 10px #ef4444); animation: shake 0.35s ease-in-out 5; }

/* Eistrank */
.fx-ice     { border-color: #60a5fa; background: rgba(96,165,250,0.18); }
.fx-ice .t-visual { filter: drop-shadow(0 0 10px #60a5fa) brightness(1.4); }

/* Gifttrank */
.fx-poison  { border-color: #a855f7; background: rgba(168,85,247,0.18); }
.fx-poison .t-visual { filter: drop-shadow(0 0 10px #a855f7) hue-rotate(80deg); animation: wobble 2.5s ease-in-out infinite; }

/* Wachstumstrank */
.fx-growth  { border-color: #10b981; background: rgba(16,185,129,0.18); }
.fx-growth .t-visual { transform: scale(1.4); filter: drop-shadow(0 0 12px #10b981); }

/* Stärketrank */
.fx-strength { border-color: #f472b6; background: rgba(244,114,182,0.18); }
.fx-strength .t-visual { transform: scale(1.2); filter: drop-shadow(0 0 10px #f472b6); animation: strength-pulse 1s ease-in-out infinite; }

/* Leuchttrank */
.fx-glow    { border-color: #fbbf24; background: rgba(251,191,36,0.18); animation: glow-border 1.5s ease-in-out infinite; }
.fx-glow .t-visual { filter: drop-shadow(0 0 18px #fbbf24) brightness(1.9); }

/* Dunkeltrank */
.fx-darkness { border-color: #374151; background: rgba(0,0,0,0.65); }
.fx-darkness .t-visual { filter: brightness(0.15); }

/* Vitalitätstrank */
.fx-vitality { border-color: #34d399; background: rgba(52,211,153,0.18); }
.fx-vitality .t-visual { filter: drop-shadow(0 0 12px #34d399); animation: vitality-bounce 1s ease-in-out infinite; }

/* Inferno-Trank */
.fx-inferno { border-color: #dc2626; background: rgba(220,38,38,0.28); animation: inferno-flicker 0.18s ease-in-out infinite; }
.fx-inferno .t-visual { filter: drop-shadow(0 0 22px #dc2626) saturate(2.5); animation: shake 0.25s ease-in-out infinite; }

/* Sturmtrank (Feuer trifft Eis → Dampf/Blitz) */
.fx-storm   { border-color: #93c5fd; background: rgba(147,197,253,0.15); animation: storm-flash 1.2s ease-in-out infinite; }
.fx-storm .t-visual { filter: drop-shadow(0 0 14px #93c5fd) contrast(1.3); animation: shake 0.4s ease-in-out 4; }

/* Pestfeuer-Trank (Feuer + Gift) */
.fx-plague  { border-color: #9f1239; background: rgba(159,18,57,0.2); }
.fx-plague .t-visual { filter: drop-shadow(0 0 12px #9f1239) hue-rotate(200deg); animation: wobble 1.8s ease-in-out infinite; }

/* Glazialtrank (Eis verstärkt) */
.fx-glacial { border-color: #1e40af; background: rgba(30,64,175,0.35); }
.fx-glacial .t-visual { filter: drop-shadow(0 0 16px #3b82f6) brightness(1.7) saturate(2.5); transform: scale(0.95); }

/* Dorntrank (Gift + Kälte) */
.fx-thorn   { border-color: #65a30d; background: rgba(101,163,13,0.18); }
.fx-thorn .t-visual { filter: drop-shadow(0 0 10px #65a30d) contrast(1.4); animation: shake 0.5s ease-in-out 4; }

/* Funkeltrank (Kristallstaub allein) */
.fx-sparkle { border-color: #fbbf24; background: rgba(251,191,36,0.1); }
.fx-sparkle .t-visual { animation: sparkle-hue 1.8s linear infinite; }

/* Unstabiler Trank (kein passendes Rezept) */
.fx-unstable { border-color: #6366f1; background: rgba(99,102,241,0.15); }
.fx-unstable .t-visual { animation: mystery-hue 3s linear infinite; }

/* ===== KEYFRAMES FÜR EFFEKTE ===== */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-6px); }
  75%     { transform: translateX(6px); }
}
@keyframes wobble {
  0%,100% { transform: rotate(0deg); }
  33%     { transform: rotate(-3deg); }
  66%     { transform: rotate(3deg); }
}
@keyframes strength-pulse {
  0%,100% { transform: scale(1.2); }
  50%     { transform: scale(1.3); }
}
@keyframes glow-border {
  0%,100% { box-shadow: 0 0 10px rgba(251,191,36,0.4); }
  50%     { box-shadow: 0 0 28px rgba(251,191,36,0.8); }
}
@keyframes vitality-bounce {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.12); }
}
@keyframes inferno-flicker {
  0%,100% { opacity: 1; }
  50%     { opacity: 0.85; }
}
@keyframes storm-flash {
  0%,100% { box-shadow: 0 0 8px rgba(147,197,253,0.4); }
  50%     { box-shadow: 0 0 22px rgba(147,197,253,0.9), 0 0 42px rgba(147,197,253,0.3); }
}
@keyframes sparkle-hue {
  0%   { filter: hue-rotate(0deg)   drop-shadow(0 0 8px #fbbf24) brightness(1.6); }
  50%  { filter: hue-rotate(180deg) drop-shadow(0 0 14px #818cf8) brightness(1.9); }
  100% { filter: hue-rotate(360deg) drop-shadow(0 0 8px #fbbf24) brightness(1.6); }
}
@keyframes mystery-hue {
  from { filter: hue-rotate(0deg)   drop-shadow(0 0 10px #818cf8); }
  to   { filter: hue-rotate(360deg) drop-shadow(0 0 10px #818cf8); }
}

/* ===== REZEPTBUCH-MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-overlay.hidden { display: none; }

.modal-box {
  background: linear-gradient(135deg, #120820, #1e0f35);
  border: 2px solid var(--accent-gold);
  border-radius: 18px;
  padding: 22px;
  max-width: 600px;
  width: 92%;
  max-height: 78vh;
  overflow-y: auto;
  box-shadow: var(--glow-gold), var(--glow-purp);
}
.modal-box h2 { color: var(--accent-gold); text-align: center; margin-bottom: 14px; font-size: 1.3em; }

.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 9px; }

.recipe-entry {
  background: rgba(0,0,0,0.32);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.re-icon        { font-size: 1.8em; }
.re-name        { font-size: 0.88em; color: var(--accent-gold); font-weight: bold; margin: 2px 0; }
.re-ingredients { font-size: 0.72em; color: var(--text-muted); }
.empty-book     { text-align: center; color: var(--text-muted); font-style: italic; padding: 24px; }

#btn-close {
  display: block;
  margin: 14px auto 0;
  background: transparent;
  border: 2px solid var(--border);
  color: var(--text-light);
  padding: 7px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
#btn-close:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

/* ===== TOAST-BENACHRICHTIGUNG ===== */
#toast {
  position: fixed;
  top: 18px; left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #5b21b6, #8b5cf6);
  border: 2px solid var(--accent-gold);
  color: #fff;
  padding: 9px 22px;
  border-radius: 10px;
  font-size: 0.95em;
  box-shadow: var(--glow-gold);
  z-index: 200;
  pointer-events: none;
  transition: opacity 0.5s;
  white-space: pre-line;
  text-align: center;
  max-width: 340px;
}
#toast.hidden { opacity: 0; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

</style>
</head>
<body>

<div id="game">

  <!-- KOPFZEILE -->
  <header>
    <h1>⚗️ Potion Lab</h1>
    <button id="btn-book">📖 Rezeptbuch</button>
  </header>

  <!-- AUFTRAGSLEISTE -->
  <section id="quests">
    <h2>📋 Aktive Aufträge</h2>
    <div id="quest-list"></div>
  </section>

  <!-- HAUPT-3-SPALTEN -->
  <div id="main-area">

    <!-- LINKS: Zutaten -->
    <div class="panel">
      <h2>🧺 Zutaten</h2>
      <div id="ingredient-list"></div>
    </div>

    <!-- MITTE: Kessel + Slots + Brauen -->
    <div id="center-panel">

        <div class="cauldron-wrap">

            <div class="steam-puff"></div>
            <div class="steam-puff"></div>
            <div class="steam-puff"></div>

            <div class="cauldron-rim"></div>
            <div id="cauldron-liquid" class="cauldron-liquid"></div>

            <div class="cauldron-leg r"></div>

<div id="book-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>📖 Rezeptbuch</h2>

    <button id="btn-close">Schließen</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="hidden"></div>

<script>
'use strict';

// ============================================================
// ABSCHNITT 1: DATEN
// Alle unveränderlichen Spielkonstanten – Zutaten, Effekte,
// Ziele und Aufträge. Nichts davon wird zur Laufzeit geändert.
// ============================================================

/**
 * Jede Zutat hat genau 2 Tags.
 * Der Tag-Pool ist bewusst klein gehalten, damit Kombinationen
 * vorhersehbar sind und keine toten Pfade entstehen.
 *
 * Tag-Übersicht:
 *   heal      – Mondblüte
 *   light     – Mondblüte, Sonnenblüte
 *   fire      – Drachenschuppe
 *   strength  – Drachenschuppe
 *   ice       – Frostbeere
 *   slow      – Frostbeere
 *   dark      – Schattenmoose
 *   poison    – Schattenmoose
 *   energy    – Sonnenblüte
 *   magic     – Kristallstaub
 *   amplify   – Kristallstaub
 */
const INGREDIENTS = [
  { id: 'moonflower',  name: 'Mondblüte',      icon: '🌸', tags: ['heal',     'light']    },
  { id: 'dragonscale', name: 'Drachenschuppe',  icon: '🔥', tags: ['fire',     'strength'] },
  { id: 'frostberry',  name: 'Frostbeere',      icon: '❄️', tags: ['ice',      'slow']     },
  { id: 'shadowmoss',  name: 'Schattenmoose',   icon: '🌿', tags: ['dark',     'poison']   },
  { id: 'sunpetal',    name: 'Sonnenblüte',     icon: '☀️', tags: ['light',    'energy']   },
  { id: 'crystaldust', name: 'Kristallstaub',   icon: '💎', tags: ['magic',    'amplify']  },
];

/**
 * Rezeptliste. Die Engine prüft Effekte in absteigender Priorität
 * und nimmt den ersten, bei dem ALLE requiredTags vorhanden sind.
 *
 * Erreichbarkeits-Übersicht (Welche Kombis triggern was):
 *   inferno   fire+amplify    → Drachenschuppe + Kristallstaub
 *   vitality  heal+energy     → Mondblüte + Sonnenblüte
 *   glow      light+magic     → (Mondblüte od. Sonnenblüte) + Kristallstaub
 *   darkness  dark+magic      → Schattenmoose + Kristallstaub
 *   strength  strength+energy → Drachenschuppe + Sonnenblüte
 *   storm     fire+ice        → Drachenschuppe + Frostbeere
 *   plague    fire+poison     → Drachenschuppe + Schattenmoose
 *   glacial   ice+amplify     → Frostbeere + Kristallstaub
 *   growth    light+energy    → Sonnenblüte (allein)
 *   thorn     poison+slow     → Schattenmoose + Frostbeere
 *   healing   heal            → Mondblüte (allein oder mit Frostbeere/Schattenmoose)
 *   fire      fire            → Drachenschuppe (allein)
 *   ice       ice             → Frostbeere (allein)
 *   poison    poison          → Schattenmoose (allein)
 *   sparkle   magic           → Kristallstaub (allein)
 *   unstable  (kein Match)    → Fallback, z. B. Mondblüte + Sonnenblüte + Kristallstaub
 *                               (wird von vitality prio 9 abgefangen – tatsächlich fast unmöglich)
 */
const EFFECTS = [
  // --- Zweikomponenten-Spezialrezepte (hohe Priorität) ---
  { id: 'inferno',   priority: 10, requiredTags: ['fire',     'amplify'],   name: 'Inferno-Trank',    icon: '🌋', liquidColor: '#dc2626', desc: 'Verheerendes Höllenfeuer — alles verbrennt!' },
  { id: 'vitality',  priority:  9, requiredTags: ['heal',     'energy'],    name: 'Vitalitätstrank',  icon: '💫', liquidColor: '#34d399', desc: 'Alle Lebenskräfte werden vollständig aufgefüllt.' },
  { id: 'glow',      priority:  8, requiredTags: ['light',    'magic'],     name: 'Leuchttrank',      icon: '✨', liquidColor: '#fbbf24', desc: 'Das Ziel erstrahlt in magischem Licht.' },
  { id: 'darkness',  priority:  8, requiredTags: ['dark',     'magic'],     name: 'Dunkeltrank',      icon: '🌑', liquidColor: '#1f2937', desc: 'Tiefe, undurchdringliche Dunkelheit hüllt das Ziel ein.' },
  { id: 'strength',  priority:  7, requiredTags: ['strength', 'energy'],   name: 'Stärketrank',      icon: '💪', liquidColor: '#f472b6', desc: 'Verleiht übermenschliche Kraft.' },
  { id: 'storm',     priority:  7, requiredTags: ['fire',     'ice'],       name: 'Sturmtrank',       icon: '⚡', liquidColor: '#93c5fd', desc: 'Feuer und Eis kollidieren zu einem reißenden Sturm.' },
  { id: 'plague',    priority:  7, requiredTags: ['fire',     'poison'],    name: 'Pestfeuer-Trank',  icon: '🐍', liquidColor: '#7f1d1d', desc: 'Giftige schwarze Flammen zerfressen alles.' },
  { id: 'glacial',   priority:  7, requiredTags: ['ice',      'amplify'],   name: 'Glazialtrank',     icon: '🧊', liquidColor: '#1e3a8a', desc: 'Absoluter Frost — kein Entkommen mehr.' },
  // --- Zweikomponenten ohne überlappende Tags (mittlere Priorität) ---
  { id: 'growth',    priority:  6, requiredTags: ['light',    'energy'],    name: 'Wachstumstrank',   icon: '🌱', liquidColor: '#10b981', desc: 'Lässt Pflanzen prächtig erblühen.' },
  { id: 'thorn',     priority:  6, requiredTags: ['poison',   'slow'],      name: 'Dorntrank',        icon: '🌵', liquidColor: '#65a30d', desc: 'Vergiftete Dornen brechen durch die Oberfläche.' },
  // --- Einzelzutaten-Basisrezepte (niedrigere Priorität) ---
  { id: 'healing',   priority:  5, requiredTags: ['heal'],                  name: 'Heiltrank',        icon: '💚', liquidColor: '#22c55e', desc: 'Heilt Wunden und stärkt die Lebenskraft.' },
  { id: 'fire',      priority:  5, requiredTags: ['fire'],                  name: 'Feuertrank',       icon: '🔥', liquidColor: '#ef4444', desc: 'Hüllt das Ziel in lodernde Flammen.' },
  { id: 'ice',       priority:  5, requiredTags: ['ice'],                   name: 'Eistrank',         icon: '❄️', liquidColor: '#60a5fa', desc: 'Friert das Ziel in einem Eisblock ein.' },
  { id: 'poison',    priority:  5, requiredTags: ['poison'],                name: 'Gifttrank',        icon: '☠️', liquidColor: '#a855f7', desc: 'Vergiftet das Ziel langsam.' },
  { id: 'sparkle',   priority:  4, requiredTags: ['magic'],                 name: 'Funkeltrank',      icon: '🪄', liquidColor: '#c084fc', desc: 'Kristallmagie ohne Richtung — hübsch, aber unklar.' },
  // --- Fallback wenn kein Rezept passt ---
  { id: 'unstable',  priority:  0, requiredTags: [],                        name: 'Unstabiler Trank', icon: '💥', liquidColor: '#6366f1', desc: 'Unbekannte Kombination — Wirkung unvorhersehbar.' },
];

/** Die drei Entitäten, auf die ein Trank angewendet werden kann. */
const TARGETS = [
  { id: 'player', name: 'Spieler', icon: '🧙', desc: 'Du selbst' },
  { id: 'plant',  name: 'Pflanze', icon: '🌺', desc: 'Ein zartes Gewächs' },
  { id: 'dummy',  name: 'Dummy',   icon: '🪆', desc: 'Trainings-Dummy' },
];

/**
 * Fünf Aufträge. req.targetId === null bedeutet "jedes Ziel".
 * Alle Aufträge sind mit dem obigen Tag-System lösbar.
 */
const QUESTS = [
  {
    id: 'q1', title: '💚 Heile dich selbst',
    desc: 'Braue einen Heiltrank und trink ihn.',
    req: { effectId: 'healing', targetId: 'player' },
    reward: 'Tipp: Mondblüte enthält das Tag "heal".',
  },
  {
    id: 'q2', title: '🌱 Lass es wachsen',
    desc: 'Gib der Pflanze einen Wachstumstrank.',
    req: { effectId: 'growth', targetId: 'plant' },
    reward: 'Die Pflanze bedankt sich herzlich!',
  },
  {
    id: 'q3', title: '❄️ Einfrieren!',
    desc: 'Friere den Dummy mit einem Eistrank ein.',
    req: { effectId: 'ice', targetId: 'dummy' },
    reward: 'Bravo, Meister der Kälte!',
  },
  {
    id: 'q4', title: '✨ Bringt Licht!',
    desc: 'Braue einen Leuchttrank (egal für wen).',
    req: { effectId: 'glow', targetId: null },
    reward: 'Die Dunkelheit weicht zurück!',
  },
  {
    id: 'q5', title: '🌋 Das große Inferno',
    desc: 'Entfache das Höllenfeuer am Dummy!',
    req: { effectId: 'inferno', targetId: 'dummy' },
    reward: '🏆 Meister-Alchemist!',
  },
];

// ============================================================
// ABSCHNITT 2: SPIELZUSTAND
// Alle Laufzeit-Daten. Wird nur durch Aktionsfunktionen geändert.
// ============================================================

const state = {
  /** Aktuell ausgewählte Zutaten-IDs (max. 3). */
  selected: [],

  /**
   * EFFECT-Objekt nach dem Brauen, null sonst.
   * Solange != null gilt: Trank bereit zum Anwenden.
   */
  currentPotion: null,

  /**
   * Verhindert Doppelklick auf "Brauen" während der Animation.
   * true = Animation läuft, UI-Interaktion gesperrt.
   */
  isBrewing: false,

  /** Aktiver Effekt-ID pro Ziel (persistenter Status). */
  targetEffects: { player: null, plant: null, dummy: null },

  /**
   * Liste entdeckter Rezepte fürs Rezeptbuch.
   * Format: { key: string, effectId: string, ingredients: string[] }
   * key = sortierte Zutaten-IDs, verhindert Duplikate.
   */
  discovered: [],

  /** IDs der abgeschlossenen Aufträge. */
  completedQuests: [],
};

// ============================================================
// ABSCHNITT 3: REZEPTLOGIK
// Kernalgorithmus: Zutaten-Tags → Effekt-Matching.
// ============================================================

/**
 * Sucht für eine gegebene Zutatenliste den passenden Effekt.
 *
 * Algorithmus:
 * 1. Sammle alle Tags der gewählten Zutaten in einem Set.
 * 2. Sortiere EFFECTS nach Priorität (absteigend).
 * 3. Nimm den ersten Effekt, bei dem ALLE requiredTags vorhanden sind.
 * 4. Fallback: 'unstable' (leere requiredTags → immer Match).
 *
 * Reihenfolge der Zutaten spielt keine Rolle, da Tags in einem Set
 * gesammelt werden (keine Duplikate, kein Index).
 *
 * @param {string[]} ingredientIds
 * @returns {Object} EFFECTS-Eintrag
 */
function matchEffect(ingredientIds) {
  // Tags aller gewählten Zutaten sammeln (Set vermeidet Duplikate)
  const tagSet = new Set(
    ingredientIds.flatMap(id => INGREDIENTS.find(i => i.id === id)?.tags ?? [])
  );

  // Effekte nach Priorität sortieren (höchste zuerst), stabil dank sort()
  const sorted = [...EFFECTS].sort((a, b) => b.priority - a.priority);

  for (const effect of sorted) {
    if (effect.requiredTags.length === 0) continue; // Fallback am Ende
    if (effect.requiredTags.every(tag => tagSet.has(tag))) return effect;
  }

  // 'unstable' hat requiredTags: [] → wird hier direkt zurückgegeben
  return EFFECTS.find(e => e.id === 'unstable');
}

// ============================================================
// ABSCHNITT 4: UI-RENDERING
// Zustandslose Render-Funktionen – nur lesen, nie schreiben.
// ============================================================

/** Zutatenliste links neu aufbauen. */
function renderIngredients() {
  const list = document.getElementById('ingredient-list');
  list.innerHTML = '';

  for (const ing of INGREDIENTS) {
    const isSelected = state.selected.includes(ing.id);
    // Karte sperren wenn: Slots voll (und nicht selbst gewählt) ODER Brau-Animation läuft
    const isLocked = state.isBrewing || (state.selected.length >= 3 && !isSelected);

    const card = document.createElement('div');
    card.className = 'ing-card'
      + (isSelected ? ' ing-selected' : '')
      + (isLocked   ? ' ing-disabled' : '');

    card.innerHTML = `
      <span class="ing-icon">${ing.icon}</span>
      <div>
        <span class="ing-name">${ing.name}</span>
        <span class="ing-tags">${ing.tags.join(' · ')}</span>
      </div>`;

    if (!isLocked) card.addEventListener('click', () => toggleIngredient(ing.id));
    list.appendChild(card);
  }
}

/** Drei Slots über dem Kessel neu aufbauen. */
function renderSlots() {
  const container = document.getElementById('slots');
  container.innerHTML = '';

  for (let i = 0; i < 3; i++) {
    const slot = document.createElement('div');
    const ingId = state.selected[i];

    if (ingId) {
      const ing = INGREDIENTS.find(x => x.id === ingId);
      slot.className = 'slot filled' + (state.isBrewing ? ' locked' : '');

      const xBtn = document.createElement('button');
      xBtn.className = 'x-btn';
      xBtn.textContent = '✕';
      xBtn.addEventListener('click', e => { e.stopPropagation(); removeSlot(i); });

      const icon = document.createElement('span');
      icon.textContent = ing.icon;

      slot.appendChild(xBtn);
      slot.appendChild(icon);
    } else {
      slot.className = 'slot';
    }

    container.appendChild(slot);
  }

  // Brauen-Button: nur aktiv wenn Zutaten da, kein Trank fertig und nicht gerade am Brauen
  const brewBtn = document.getElementById('btn-brew');
  const canBrew = state.selected.length > 0 && !state.currentPotion && !state.isBrewing;
  brewBtn.disabled = !canBrew;
  brewBtn.textContent = state.isBrewing ? '⏳ Braue...' : '✨ Brauen!';
}

/**
 * Trank-Statusanzeige in der Mitte.
 * Zeigt je nach state einen von vier möglichen Zuständen.
 */
function renderPotionInfo() {
  const panel = document.getElementById('potion-info');
  panel.className = 'potion-info' + (state.currentPotion ? ' has-potion' : '');

  if (state.isBrewing) {
    panel.innerHTML = `<span class="p-brewing">⏳ Der Trank nimmt Gestalt an…</span>`;
    return;
  }

  if (state.currentPotion) {
    const e = state.currentPotion;
    panel.innerHTML = `
      <span class="p-icon">${e.icon}</span>
      <span class="p-name">${e.name}</span>
      <span class="p-desc">${e.desc}</span>
      <span class="p-hint">→ Klicke ein Ziel, um den Trank anzuwenden!</span>`;
    return;
  }

  if (state.selected.length > 0) {
    const icons = state.selected.map(id => INGREDIENTS.find(i => i.id === id)?.icon ?? '?').join(' ');
    panel.innerHTML = `<span class="p-ready">${icons}&nbsp; Bereit zum Brauen!</span>`;
    return;
  }

  panel.innerHTML = `<span class="p-idle">Wähle Zutaten und braue einen Trank...</span>`;
}

/** Drei Zielkarten rechts neu aufbauen. */
function renderTargets() {
  const list = document.getElementById('target-list');
  list.innerHTML = '';
  // Ziele nur klickbar wenn ein Trank fertig ist
  const canApply = state.currentPotion !== null && !state.isBrewing;

  for (const target of TARGETS) {
    const effectId = state.targetEffects[target.id];
    const card = document.createElement('div');
    // fx-Klasse setzt den visuellen Effektstatus (CSS-Selektor .fx-*)
    card.className = 'target-card'
      + (effectId  ? ` fx-${effectId}` : '')
      + (canApply  ? '' : ' t-disabled');

    card.innerHTML = `
      <span class="t-visual">${target.icon}</span>
      <span class="t-name">${target.name}</span>
      <span class="t-status">${getTargetStatusLabel(target.id)}</span>`;

    if (canApply) card.addEventListener('click', () => applyPotion(target.id));
    list.appendChild(card);
  }
}

/** Lesbare Status-Beschriftung für ein Ziel. */
function getTargetStatusLabel(targetId) {
  const eid = state.targetEffects[targetId];
  if (!eid) return 'Unberührt';
  const e = EFFECTS.find(x => x.id === eid);
  return e ? `${e.icon} ${e.name}` : '';
}

/** Auftragsleiste neu aufbauen. */
function renderQuests() {
  const list = document.getElementById('quest-list');
  list.innerHTML = '';
  for (const q of QUESTS) {
    const done = state.completedQuests.includes(q.id);
    const div = document.createElement('div');
    div.className = 'quest-card' + (done ? ' done' : '');
    div.innerHTML = `
      <span class="q-title">${done ? '✅ ' : ''}${q.title}</span>
      <span class="q-desc">${q.desc}</span>`;
    list.appendChild(div);
  }
}

/** Alles auf einmal neu rendern. */
function renderAll() {
  renderIngredients();
  renderSlots();
  renderPotionInfo();
  renderTargets();
  renderQuests();
}

// ============================================================
// ABSCHNITT 5: EFFEKTLOGIK (Spielaktionen)
// Einzige Stelle wo state verändert wird. Jede Funktion
// endet mit einem renderAll() oder gezielten Re-Renders.
// ============================================================

/** Zutat auswählen oder abwählen. Setzt currentPotion zurück. */
function toggleIngredient(id) {
  if (state.isBrewing) return; // Eingabe während Animation ignorieren

  const idx = state.selected.indexOf(id);
  if (idx !== -1) {
    state.selected.splice(idx, 1);
  } else if (state.selected.length < 3) {
    state.selected.push(id);
  }

  // Trank zurücksetzen wenn Zutaten geändert werden
  state.currentPotion = null;
  document.getElementById('cauldron-liquid').style.background = '';

  renderAll();
}

/** Einzelne Zutat aus einem Slot entfernen (X-Knopf). */
function removeSlot(index) {
  if (state.isBrewing) return;
  state.selected.splice(index, 1);
  state.currentPotion = null;
  document.getElementById('cauldron-liquid').style.background = '';
  renderAll();
}

/**
 * Brauprozess starten.
 * Sperrt die UI für die Dauer der Animation, löst dann den Effekt auf.
 */
function brew() {
  if (state.selected.length === 0 || state.isBrewing || state.currentPotion) return;

  // Sofort sperren – verhindert Doppelklick
  state.isBrewing = true;
  renderAll();

  // Kessel-Animation
  const body = document.getElementById('cauldron-body');
  body.classList.add('brewing');

  setTimeout(() => {
    body.classList.remove('brewing');
    state.isBrewing = false;

    // Effekt berechnen und speichern
    const effect = matchEffect(state.selected);
    state.currentPotion = effect;

    // Kesselflüssigkeit einfärben
    document.getElementById('cauldron-liquid').style.background =
      `radial-gradient(ellipse, ${effect.liquidColor}cc, ${effect.liquidColor})`;

    // Rezept ins Buch eintragen wenn neu
    recordRecipe(effect);

    renderAll();
  }, 1000);
}

/**
 * Fertigen Trank auf ein Ziel anwenden.
 * Danach vollständiger State-Reset (Auswahl + Trank).
 */
function applyPotion(targetId) {
  if (!state.currentPotion || state.isBrewing) return;

  const effect     = state.currentPotion;
  const targetName = TARGETS.find(t => t.id === targetId)?.name ?? targetId;

  // Effekt-Status auf dem Ziel setzen
  state.targetEffects[targetId] = effect.id;

  // Aufträge prüfen bevor State reset
  checkQuests(effect.id, targetId);

  // --- VOLLSTÄNDIGER STATE-RESET nach Anwendung ---
  state.selected      = [];
  state.currentPotion = null;
  document.getElementById('cauldron-liquid').style.background = '';

  renderAll();
  showToast(`${effect.icon} ${effect.name} wirkt auf ${targetName}!`);
}

/**
 * Neues Rezept ins Rezeptbuch eintragen (wenn noch nicht bekannt).
 * Schlüssel = sortierte IDs → Reihenfolge egal.
 */
function recordRecipe(effect) {
  const key = [...state.selected].sort().join('+');
  const alreadyKnown = state.discovered.some(r => r.key === key && r.effectId === effect.id);
  if (!alreadyKnown) {
    state.discovered.push({
      key,
      effectId: effect.id,
      ingredients: [...state.selected],
    });
    showToast(`📖 Neues Rezept entdeckt: ${effect.icon} ${effect.name}!`);
  }
}

// ============================================================
// ABSCHNITT 6: QUESTLOGIK
// ============================================================

/**
 * Prüft nach jeder Anwendung, ob ein Auftrag erfüllt wurde.
 * Mehrere Aufträge können gleichzeitig abgehakt werden.
 *
 * @param {string} effectId  - ID des angewendeten Effekts
 * @param {string} targetId  - ID des Ziels
 */
function checkQuests(effectId, targetId) {
  for (const q of QUESTS) {
    if (state.completedQuests.includes(q.id)) continue;

    const effectMatches = q.req.effectId === effectId;
    const targetMatches = q.req.targetId === null || q.req.targetId === targetId;

    if (effectMatches && targetMatches) {
      state.completedQuests.push(q.id);
      // Versetzt damit der Anwendungs-Toast zuerst erscheint
      setTimeout(() => showToast(`✅ Auftrag erfüllt: ${q.title}\n🎁 ${q.reward}`, 3500), 1200);
    }
  }
}

// ============================================================
// ABSCHNITT 7: REZEPTBUCH
// ============================================================

function openBook() {
  const grid = document.getElementById('recipe-grid');
  grid.innerHTML = '';

  if (state.discovered.length === 0) {
    grid.innerHTML = '<div class="empty-book">Noch keine Rezepte entdeckt.<br>Braue deinen ersten Trank!</div>';
  } else {
    for (const rec of state.discovered) {
      const effect = EFFECTS.find(e => e.id === rec.effectId);
      if (!effect) continue;

      const icons = rec.ingredients
        .map(id => INGREDIENTS.find(i => i.id === id)?.icon ?? '?')
        .join(' + ');
      const names = rec.ingredients
        .map(id => INGREDIENTS.find(i => i.id === id)?.name ?? '?')
        .join(' + ');

      const entry = document.createElement('div');
      entry.className = 'recipe-entry';
      entry.style.borderColor = effect.liquidColor + '99';
      entry.innerHTML = `
        <div class="re-icon">${effect.icon}</div>
        <div class="re-name">${effect.name}</div>
        <div class="re-ingredients">${icons}</div>
        <div class="re-ingredients">${names}</div>`;
      grid.appendChild(entry);
    }
  }

  document.getElementById('book-modal').classList.remove('hidden');
}

function closeBook() {
  document.getElementById('book-modal').classList.add('hidden');
}

// ============================================================
// ABSCHNITT 8: BENACHRICHTIGUNGEN
// ============================================================

let toastTimer = null;

/**
 * Zeigt einen Toast-Text am oberen Rand.
 * Mehrfachaufrufe ersetzen den laufenden Timer.
 */
function showToast(msg, duration = 2600) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), duration);
}

// ============================================================
// ABSCHNITT 9: INITIALISIERUNG
// ============================================================

document.getElementById('btn-book').addEventListener('click', openBook);
document.getElementById('btn-brew').addEventListener('click', brew);
document.getElementById('btn-close').addEventListener('click', closeBook);

// Modal schließen bei Klick auf den Overlay-Hintergrund
document.getElementById('book-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('book-modal')) closeBook();
});

renderAll();

</script>

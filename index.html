<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚗️ Potion Lab</title>
<style>

/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-dark:      #120820;
  --bg-mid:       #1e0f35;
  --bg-panel:     #2a1548;
  --bg-card:      #200d38;
  --accent-gold:  #f0c040;
  --accent-purp:  #8b5cf6;
  --text-light:   #e2d4f8;
  --text-muted:   #9070b0;
  --border:       #5b3490;
  --glow-purp:    0 0 14px rgba(139,92,246,0.45);
  --glow-gold:    0 0 14px rgba(240,192,64,0.55);
}

body {
  background: var(--bg-dark);
  color: var(--text-light);
  font-family: Georgia, 'Times New Roman', serif;
  min-height: 100vh;
}

/* ===== TOP-LEVEL LAYOUT ===== */
#game {
  max-width: 1120px;
  margin: 0 auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ===== HEADER ===== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, var(--bg-mid), var(--bg-panel));
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 10px 20px;
  box-shadow: var(--glow-purp);
}
header h1 {
  font-size: 1.7em;
  color: var(--accent-gold);
  text-shadow: 0 0 12px rgba(240,192,64,0.5);
  letter-spacing: 1px;
}
#btn-book {
  background: var(--bg-panel);
  border: 2px solid var(--accent-gold);
  color: var(--accent-gold);
  padding: 7px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95em;
  transition: all 0.2s;
}
#btn-book:hover {
  background: var(--accent-gold);
  color: var(--bg-dark);
  box-shadow: var(--glow-gold);
}

/* ===== QUEST STRIP ===== */
#quests {
  background: linear-gradient(135deg, #160a28, #221040);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
}
#quests h2 {
  font-size: 0.9em;
  color: var(--accent-gold);
  margin-bottom: 8px;
}
#quest-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.quest-card {
  flex: 1;
  min-width: 140px;
  background: rgba(91,52,144,0.18);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 0.82em;
  transition: all 0.3s;
}
.quest-card.done {
  background: rgba(34,197,94,0.15);
  border-color: #22c55e;
  opacity: 0.65;
}
.quest-card .q-title { font-weight: bold; color: var(--accent-gold); display: block; }
.quest-card .q-desc  { color: var(--text-muted); }

/* ===== MAIN 3-COLUMN ===== */
#main-area {
  display: grid;
  grid-template-columns: 200px 1fr 205px;
  gap: 10px;
  align-items: start;
}

/* ===== SHARED PANEL ===== */
.panel {
  background: linear-gradient(180deg, var(--bg-mid), var(--bg-panel));
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  box-shadow: var(--glow-purp);
}
.panel h2 {
  font-size: 0.9em;
  color: var(--accent-gold);
  text-align: center;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* ===== INGREDIENT CARDS ===== */
.ing-card {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.28);
  border: 2px solid transparent;
  border-radius: 8px;
  padding: 7px 9px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.ing-card:hover:not(.ing-disabled) {
  background: rgba(139,92,246,0.2);
  border-color: var(--accent-purp);
  transform: translateX(3px);
}
.ing-card.ing-selected {
  background: rgba(240,192,64,0.12);
  border-color: var(--accent-gold);
  box-shadow: 0 0 8px rgba(240,192,64,0.35);
}
.ing-card.ing-disabled {
  opacity: 0.42;
  cursor: not-allowed;
}
.ing-icon { font-size: 1.5em; width: 32px; text-align: center; }
.ing-name { font-size: 0.88em; font-weight: bold; color: var(--text-light); display: block; }
.ing-tags { font-size: 0.68em; color: var(--text-muted); }

/* ===== CAULDRON CENTER PANEL ===== */
#center-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

/* Lab background */
.lab-box {
  width: 100%;
  background:
    radial-gradient(ellipse at 50% 90%, rgba(91,52,144,0.25) 0%, transparent 70%),
    linear-gradient(180deg, #0e0618 0%, #180b2a 100%);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 16px 14px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--glow-purp);
}

/* Wooden shelf at top */
.lab-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 36px;
  background: repeating-linear-gradient(
    90deg,
    #251040 0px, #251040 28px,
    #180c30 28px, #180c30 32px
  );
  border-bottom: 4px solid #4a2072;
  z-index: 0;
}
/* Shelf decoration candles */
.lab-box::after {
  content: '🕯️  🧿  🕯️';
  position: absolute;
  top: 3px; left: 0; right: 0;
  text-align: center;
  font-size: 1em;
  z-index: 1;
  pointer-events: none;
}

/* CSS-drawn cauldron */
.cauldron-wrap {
  position: relative;
  margin-top: 28px;
  z-index: 2;
}
.cauldron-body {
  width: 110px;
  height: 76px;
  background: linear-gradient(145deg, #3a3355, #1a1228);
  border-radius: 10px 10px 44% 44%;
  border: 3px solid #5a4a80;
  position: relative;
  box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  animation: cauldron-float 3.2s ease-in-out infinite;
  transition: filter 0.4s;
}
.cauldron-body.brewing {
  filter: drop-shadow(0 0 20px rgba(180,100,255,0.9));
  animation: cauldron-brew 0.3s ease-in-out 6;
}
.cauldron-rim {
  position: absolute;
  top: -10px; left: -8px; right: -8px;
  height: 18px;
  background: linear-gradient(180deg, #6a5a90, #3a2a58);
  border-radius: 6px;
  border: 2px solid #7a6aaa;
}
.cauldron-liquid {
  position: absolute;
  bottom: 10px;
  left: 14px; right: 14px;
  height: 24px;
  border-radius: 50%;
  background: radial-gradient(ellipse, #c084fc, #7c3aed);
  animation: liquid-bubble 1.8s ease-in-out infinite;
  transition: background 0.6s;
}
.cauldron-leg { position: absolute; bottom: -10px; width: 9px; height: 14px; background: #2a1a40; border-radius: 3px; }
.cauldron-leg.l { left: 18px; }
.cauldron-leg.r { right: 18px; }

/* Steam above cauldron */
.steam-row {
  position: absolute;
  top: -30px; left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
}
.steam-puff {
  width: 10px; height: 28px;
  background: radial-gradient(ellipse, rgba(180,140,255,0.5), transparent);
  border-radius: 50%;
  animation: steam-up 2.2s ease-out infinite;
  opacity: 0;
}
.steam-puff:nth-child(2) { animation-delay: 0.75s; }
.steam-puff:nth-child(3) { animation-delay: 1.5s;  }

@keyframes cauldron-float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}
@keyframes cauldron-brew {
  0%,100% { transform: scale(1) rotate(0deg); }
  50%     { transform: scale(1.08) rotate(4deg); }
}
@keyframes liquid-bubble {
  0%,100% { transform: scaleY(1);   opacity: 0.85; }
  50%     { transform: scaleY(0.88); opacity: 1; }
}
@keyframes steam-up {
  0%   { opacity: 0.7; transform: translateY(0) scaleX(1); }
  100% { opacity: 0;   transform: translateY(-36px) scaleX(2.2); }
}

/* Ingredient slots */
#slots {
  display: flex;
  gap: 8px;
  z-index: 2;
}
.slot {
  width: 58px; height: 58px;
  background: rgba(0,0,0,0.4);
  border: 2px dashed var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5em;
  position: relative;
  transition: all 0.2s;
}
.slot.filled {
  border-style: solid;
  border-color: var(--accent-gold);
  background: rgba(240,192,64,0.1);
  box-shadow: 0 0 8px rgba(240,192,64,0.35);
}
.slot .x-btn {
  position: absolute;
  top: -8px; right: -8px;
  background: #9f1212;
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 18px; height: 18px;
  font-size: 0.65em;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.slot.filled .x-btn { display: flex; }

/* Brew button */
#btn-brew {
  background: linear-gradient(135deg, #5b21b6, #8b5cf6);
  border: 2px solid var(--accent-gold);
  color: var(--accent-gold);
  padding: 11px 26px;
  border-radius: 10px;
  font-size: 1.05em;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.2s;
  box-shadow: var(--glow-purp);
  z-index: 2;
}
#btn-brew:hover:not(:disabled) {
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  box-shadow: var(--glow-gold), var(--glow-purp);
  transform: translateY(-2px);
}
#btn-brew:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

/* Current potion info */
#potion-info {
  min-height: 58px;
  width: 100%;
  text-align: center;
  padding: 8px 10px;
  background: rgba(0,0,0,0.28);
  border-radius: 10px;
  z-index: 2;
}
#potion-info .p-icon { font-size: 2em; display: block; }
#potion-info .p-name { font-size: 1em; color: var(--accent-gold); font-weight: bold; }
#potion-info .p-desc { font-size: 0.8em; color: var(--text-muted); }
#potion-info .p-hint { font-size: 0.78em; color: #a070d0; margin-top: 4px; animation: hint-blink 1.4s infinite; }

@keyframes hint-blink {
  0%,100% { opacity: 0.55; }
  50%      { opacity: 1; }
}

/* ===== TARGET CARDS ===== */
.target-card {
  background: rgba(0,0,0,0.28);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 12px 10px;
  margin-bottom: 8px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.3s, background 0.3s, transform 0.2s, box-shadow 0.3s;
  position: relative;
  overflow: hidden;
}
.target-card:hover:not(.t-disabled) {
  border-color: var(--accent-purp);
  background: rgba(139,92,246,0.18);
  transform: scale(1.04);
}
.target-card.t-disabled { cursor: default; opacity: 0.7; }
.target-card.t-disabled:hover { transform: none; border-color: var(--border); background: rgba(0,0,0,0.28); }
.t-visual { font-size: 3em; display: block; margin-bottom: 4px; transition: filter 0.3s, transform 0.3s; }
.t-name   { font-size: 0.88em; font-weight: bold; }
.t-status { font-size: 0.73em; color: var(--text-muted); min-height: 15px; display: block; margin-top: 2px; }

/* --- Effect visual styles applied to .target-card --- */
/* Heal */
.fx-healing   { border-color: #22c55e !important; background: rgba(34,197,94,0.15) !important; }
.fx-healing .t-visual { filter: drop-shadow(0 0 10px #22c55e); }

/* Fire */
.fx-fire      { border-color: #ef4444 !important; background: rgba(239,68,68,0.15) !important; }
.fx-fire .t-visual { filter: drop-shadow(0 0 10px #ef4444); animation: shake 0.35s ease-in-out 5; }

/* Ice */
.fx-ice       { border-color: #60a5fa !important; background: rgba(96,165,250,0.18) !important; }
.fx-ice .t-visual { filter: drop-shadow(0 0 10px #60a5fa) brightness(1.4); }

/* Poison */
.fx-poison    { border-color: #a855f7 !important; background: rgba(168,85,247,0.18) !important; }
.fx-poison .t-visual { filter: drop-shadow(0 0 10px #a855f7) hue-rotate(80deg); animation: wobble 2s ease-in-out infinite; }

/* Growth */
.fx-growth    { border-color: #10b981 !important; background: rgba(16,185,129,0.18) !important; }
.fx-growth .t-visual { transform: scale(1.4); filter: drop-shadow(0 0 12px #10b981); }

/* Strength */
.fx-strength  { border-color: #f472b6 !important; background: rgba(244,114,182,0.18) !important; }
.fx-strength .t-visual { transform: scale(1.2); filter: drop-shadow(0 0 10px #f472b6); animation: strength-pulse 0.9s ease-in-out infinite; }

/* Glow */
.fx-glow      { border-color: #fbbf24 !important; background: rgba(251,191,36,0.18) !important; animation: glow-border 1.5s infinite; }
.fx-glow .t-visual { filter: drop-shadow(0 0 18px #fbbf24) brightness(1.9); }

/* Darkness */
.fx-darkness  { border-color: #374151 !important; background: rgba(0,0,0,0.65) !important; }
.fx-darkness .t-visual { filter: brightness(0.18); }

/* Slow */
.fx-slow      { border-color: #6b7280 !important; background: rgba(107,114,128,0.18) !important; }
.fx-slow .t-visual { animation: slow-sway 3.5s ease-in-out infinite; }

/* Vitality */
.fx-vitality  { border-color: #34d399 !important; background: rgba(52,211,153,0.18) !important; }
.fx-vitality .t-visual { filter: drop-shadow(0 0 12px #34d399); animation: vitality-bounce 0.9s ease-in-out infinite; }

/* Inferno */
.fx-inferno   { border-color: #dc2626 !important; background: rgba(220,38,38,0.28) !important; animation: inferno-flicker 0.15s ease-in-out infinite; }
.fx-inferno .t-visual { filter: drop-shadow(0 0 22px #dc2626) saturate(2.5); animation: shake 0.2s ease-in-out infinite; }

/* Mystery */
.fx-mystery   { border-color: #818cf8 !important; background: rgba(129,140,248,0.18) !important; }
.fx-mystery .t-visual { animation: mystery-hue 2.5s linear infinite; }

/* Thorn */
.fx-thorn     { border-color: #65a30d !important; background: rgba(101,163,13,0.18) !important; }
.fx-thorn .t-visual { filter: drop-shadow(0 0 10px #65a30d) contrast(1.4); animation: shake 0.5s ease-in-out 4; }

/* ===== KEYFRAMES FOR EFFECTS ===== */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-6px); }
  75%     { transform: translateX(6px); }
}
@keyframes wobble {
  0%,100% { transform: rotate(0deg); }
  33%     { transform: rotate(-3deg); }
  66%     { transform: rotate(3deg); }
}
@keyframes strength-pulse {
  0%,100% { transform: scale(1.2); }
  50%     { transform: scale(1.3); }
}
@keyframes glow-border {
  0%,100% { box-shadow: 0 0 10px rgba(251,191,36,0.4); }
  50%     { box-shadow: 0 0 28px rgba(251,191,36,0.8); }
}
@keyframes slow-sway {
  0%,100% { transform: rotate(0deg); }
  33%     { transform: rotate(-2deg) translateX(-2px); }
  66%     { transform: rotate(2deg) translateX(2px); }
}
@keyframes vitality-bounce {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.12); }
}
@keyframes inferno-flicker {
  0%,100% { opacity: 1; }
  50%     { opacity: 0.88; }
}
@keyframes mystery-hue {
  from { filter: hue-rotate(0deg) drop-shadow(0 0 10px #818cf8); }
  to   { filter: hue-rotate(360deg) drop-shadow(0 0 10px #818cf8); }
}

/* ===== RECIPE BOOK MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: linear-gradient(135deg, #120820, #1e0f35);
  border: 2px solid var(--accent-gold);
  border-radius: 18px;
  padding: 22px;
  max-width: 580px;
  width: 92%;
  max-height: 78vh;
  overflow-y: auto;
  box-shadow: var(--glow-gold), var(--glow-purp);
}
.modal-box h2 {
  color: var(--accent-gold);
  text-align: center;
  margin-bottom: 14px;
  font-size: 1.3em;
}
.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 9px;
}
.recipe-entry {
  background: rgba(0,0,0,0.32);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.re-icon        { font-size: 1.8em; }
.re-name        { font-size: 0.88em; color: var(--accent-gold); font-weight: bold; margin: 2px 0; }
.re-ingredients { font-size: 0.72em; color: var(--text-muted); }
.empty-book { text-align: center; color: var(--text-muted); font-style: italic; padding: 24px; }
#btn-close {
  display: block;
  margin: 14px auto 0;
  background: transparent;
  border: 2px solid var(--border);
  color: var(--text-light);
  padding: 7px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
#btn-close:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

/* ===== NOTIFICATION TOAST ===== */
#toast {
  position: fixed;
  top: 18px; left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #5b21b6, #8b5cf6);
  border: 2px solid var(--accent-gold);
  color: #fff;
  padding: 9px 22px;
  border-radius: 10px;
  font-size: 0.95em;
  box-shadow: var(--glow-gold);
  z-index: 200;
  pointer-events: none;
  transition: opacity 0.5s;
  white-space: pre-line;
  text-align: center;
  max-width: 340px;
}
#toast.hidden { opacity: 0; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

</style>
</head>
<body>

<div id="game">

  <!-- HEADER -->
  <header>
    <h1>⚗️ Potion Lab</h1>
    <button id="btn-book">📖 Rezeptbuch</button>
  </header>

  <!-- QUEST STRIP -->
  <section id="quests">
    <h2>📋 Aktive Aufträge</h2>
    <div id="quest-list"></div>
  </section>

  <!-- MAIN 3-COLUMN AREA -->
  <div id="main-area">

    <!-- LEFT: Ingredients -->
    <div class="panel">
      <h2>🧺 Zutaten</h2>
      <div id="ingredient-list"></div>
    </div>

    <!-- CENTER: Cauldron + Slots + Brew -->
    <div id="center-panel">
      <div class="lab-box">

        <!-- CSS-drawn cauldron -->
        <div class="cauldron-wrap">
          <div class="steam-row">
            <div class="steam-puff"></div>
            <div class="steam-puff"></div>
            <div class="steam-puff"></div>
          </div>
          <div id="cauldron-body" class="cauldron-body">
            <div class="cauldron-rim"></div>
            <div id="cauldron-liquid" class="cauldron-liquid"></div>
            <div class="cauldron-leg l"></div>
            <div class="cauldron-leg r"></div>
          </div>
        </div>

        <!-- 3 ingredient slots -->
        <div id="slots"></div>

        <!-- Brew button -->
        <button id="btn-brew" disabled>✨ Brauen!</button>

        <!-- Current potion display -->
        <div id="potion-info">
          <p style="color:var(--text-muted);font-style:italic;font-size:0.84em;">Wähle Zutaten und braue einen Trank...</p>
        </div>

      </div>
    </div>

    <!-- RIGHT: Targets -->
    <div class="panel">
      <h2>🎯 Testziele</h2>
      <div id="target-list"></div>
    </div>

  </div><!-- end #main-area -->

</div><!-- end #game -->

<!-- RECIPE BOOK MODAL -->
<div id="book-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>📖 Rezeptbuch</h2>
    <div id="recipe-grid" class="recipe-grid"></div>
    <button id="btn-close">Schließen</button>
  </div>
</div>

<!-- TOAST NOTIFICATION -->
<div id="toast" class="hidden"></div>

<script>
// ============================================================
// GAME DATA
// ============================================================

/**
 * Six ingredients. Each has a list of tags that describe its magical
 * nature. The brewing engine combines tags to find the best-matching effect.
 */
const INGREDIENTS = [
  { id: 'moonflower',  name: 'Mondblüte',      icon: '🌸', tags: ['heal',     'light',  'nature']   },
  { id: 'dragonscale', name: 'Drachenschuppe',  icon: '🔥', tags: ['fire',     'strength','magic']   },
  { id: 'frostberry',  name: 'Frostbeere',      icon: '❄️', tags: ['ice',      'cold',   'slow']     },
  { id: 'shadowmoss',  name: 'Schattenmoose',   icon: '🌿', tags: ['dark',     'poison', 'nature']   },
  { id: 'sunpetal',    name: 'Sonnenblüte',     icon: '☀️', tags: ['light',    'energy', 'nature']   },
  { id: 'crystaldust', name: 'Kristallstaub',   icon: '💎', tags: ['magic',    'amplify','shine']    },
];

/**
 * All possible potion effects. The engine picks the highest-priority effect
 * whose requiredTags are all present in the combined ingredient tags.
 * priority: higher = checked first (more specific recipes win).
 * liquidColor: CSS color shown in the cauldron while that effect is active.
 */
const EFFECTS = [
  {
    id: 'inferno',   name: 'Inferno-Trank',
    desc: 'Verheerendes Höllenfeuer — alles verbrennt!',
    icon: '🌋', priority: 10, liquidColor: '#dc2626',
    requiredTags: ['fire', 'amplify'],
  },
  {
    id: 'vitality',  name: 'Vitalitätstrank',
    desc: 'Alle Lebenskräfte werden vollständig aufgefüllt.',
    icon: '💫', priority: 9, liquidColor: '#34d399',
    requiredTags: ['heal', 'energy'],
  },
  {
    id: 'growth',    name: 'Wachstumstrank',
    desc: 'Lässt Pflanzen prächtig erblühen.',
    icon: '🌱', priority: 8, liquidColor: '#10b981',
    requiredTags: ['nature', 'energy'],
  },
  {
    id: 'glow',      name: 'Leuchttrank',
    desc: 'Das Ziel erstrahlt in magischem Licht.',
    icon: '✨', priority: 8, liquidColor: '#fbbf24',
    requiredTags: ['light', 'shine'],
  },
  {
    id: 'strength',  name: 'Stärketrank',
    desc: 'Verleiht übermenschliche Kraft.',
    icon: '💪', priority: 7, liquidColor: '#f472b6',
    requiredTags: ['strength', 'magic'],
  },
  {
    id: 'darkness',  name: 'Dunkeltrank',
    desc: 'Hüllt das Ziel in tiefe, undurchdringliche Dunkelheit.',
    icon: '🌑', priority: 7, liquidColor: '#374151',
    requiredTags: ['dark', 'magic'],
  },
  {
    id: 'thorn',     name: 'Dorntrank',
    desc: 'Giftige Dornen brechen durch die Oberfläche.',
    icon: '🌵', priority: 6, liquidColor: '#65a30d',
    requiredTags: ['nature', 'poison'],
  },
  {
    id: 'healing',   name: 'Heiltrank',
    desc: 'Heilt Wunden und stärkt die Lebenskraft.',
    icon: '💚', priority: 5, liquidColor: '#22c55e',
    requiredTags: ['heal'],
  },
  {
    id: 'fire',      name: 'Feuertrank',
    desc: 'Hüllt das Ziel in lodernde Flammen.',
    icon: '🔥', priority: 5, liquidColor: '#ef4444',
    requiredTags: ['fire'],
  },
  {
    id: 'ice',       name: 'Eistrank',
    desc: 'Friert das Ziel in einem Eisblock ein.',
    icon: '❄️', priority: 5, liquidColor: '#60a5fa',
    requiredTags: ['ice'],
  },
  {
    id: 'poison',    name: 'Gifttrank',
    desc: 'Vergiftet das Ziel langsam.',
    icon: '☠️', priority: 5, liquidColor: '#a855f7',
    requiredTags: ['poison'],
  },
  {
    id: 'slow',      name: 'Langsamtrank',
    desc: 'Verlangsamt alle Bewegungen drastisch.',
    icon: '🐌', priority: 4, liquidColor: '#6b7280',
    requiredTags: ['slow'],
  },
  {
    // Fallback: no required tags, always lowest priority
    id: 'mystery',   name: 'Mysterionstrank',
    desc: 'Ein rätselhafter Trank mit unbekannten Eigenschaften...',
    icon: '🔮', priority: 0, liquidColor: '#818cf8',
    requiredTags: [],
  },
];

/** The three entities the player can throw a potion at. */
const TARGETS = [
  { id: 'player', name: 'Spieler',  icon: '🧙', desc: 'Du selbst'         },
  { id: 'plant',  name: 'Pflanze',  icon: '🌺', desc: 'Ein zartes Gewächs' },
  { id: 'dummy',  name: 'Dummy',    icon: '🪆', desc: 'Trainings-Dummy'    },
];

/**
 * Five quests. requirement.targetId === null means "any target".
 */
const QUESTS = [
  {
    id: 'q1',
    title: '💚 Heile dich selbst',
    desc: 'Braue einen Heiltrank und trink ihn.',
    req: { effectId: 'healing', targetId: 'player' },
    reward: 'Mondblüte ist der Schlüssel zum Heilen!',
  },
  {
    id: 'q2',
    title: '🌱 Lass es wachsen',
    desc: 'Gib der Pflanze einen Wachstumstrank.',
    req: { effectId: 'growth', targetId: 'plant' },
    reward: 'Die Pflanze bedankt sich herzlich!',
  },
  {
    id: 'q3',
    title: '❄️ Einfrieren!',
    desc: 'Friere den Dummy mit einem Eistrank ein.',
    req: { effectId: 'ice', targetId: 'dummy' },
    reward: 'Bravo, Meister der Kälte!',
  },
  {
    id: 'q4',
    title: '✨ Bringt Licht!',
    desc: 'Braue einen Leuchttrank für irgendein Ziel.',
    req: { effectId: 'glow', targetId: null },
    reward: 'Die Dunkelheit weicht zurück!',
  },
  {
    id: 'q5',
    title: '🌋 Das große Inferno',
    desc: 'Entfache das Höllenfeuer am Dummy!',
    req: { effectId: 'inferno', targetId: 'dummy' },
    reward: '🏆 Meister-Alchemist! Unglaublich!',
  },
];

// ============================================================
// GAME STATE
// ============================================================

const state = {
  selected:         [],   // ingredient IDs currently chosen (max 3)
  currentPotion:    null, // EFFECT object after brewing; null before/after applying
  targetEffects:    { player: null, plant: null, dummy: null }, // active effect ID per target
  discovered:       [],   // { key, effectId, ingredients[] } — for the recipe book
  completedQuests:  [],   // quest IDs
};

// ============================================================
// RECIPE ENGINE
// ============================================================

/**
 * Given an array of ingredient IDs, collect all their tags, then find the
 * highest-priority effect whose requiredTags are all present. Falls back to
 * the 'mystery' effect if nothing matches.
 */
function matchEffect(ingredientIds) {
  const allTags = ingredientIds.flatMap(id => {
    const ing = INGREDIENTS.find(i => i.id === id);
    return ing ? ing.tags : [];
  });

  // Sort high → low priority, skip mystery (priority 0) for normal pass
  const sorted = [...EFFECTS].sort((a, b) => b.priority - a.priority);

  for (const effect of sorted) {
    if (effect.requiredTags.length === 0) continue; // skip mystery
    if (effect.requiredTags.every(tag => allTags.includes(tag))) return effect;
  }

  return EFFECTS.find(e => e.id === 'mystery');
}

// ============================================================
// RENDERING
// ============================================================

/** Re-render the ingredients panel on the left. */
function renderIngredients() {
  const list = document.getElementById('ingredient-list');
  list.innerHTML = '';

  for (const ing of INGREDIENTS) {
    const selected  = state.selected.includes(ing.id);
    const slotsFull = state.selected.length >= 3 && !selected;

    const card = document.createElement('div');
    card.className = 'ing-card'
      + (selected   ? ' ing-selected'  : '')
      + (slotsFull  ? ' ing-disabled'  : '');

    card.innerHTML = `
      <span class="ing-icon">${ing.icon}</span>
      <div>
        <span class="ing-name">${ing.name}</span>
        <span class="ing-tags">${ing.tags.join(', ')}</span>
      </div>`;

    if (!slotsFull) card.addEventListener('click', () => toggleIngredient(ing.id));
    list.appendChild(card);
  }
}

/** Re-render the three ingredient slots above the cauldron. */
function renderSlots() {
  const container = document.getElementById('slots');
  container.innerHTML = '';

  for (let i = 0; i < 3; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';

    const ingId = state.selected[i];
    if (ingId) {
      const ing = INGREDIENTS.find(x => x.id === ingId);
      slot.classList.add('filled');

      const xBtn = document.createElement('button');
      xBtn.className = 'x-btn';
      xBtn.textContent = '✕';
      xBtn.addEventListener('click', (e) => { e.stopPropagation(); removeSlot(i); });

      const icon = document.createElement('span');
      icon.textContent = ing.icon;

      slot.appendChild(xBtn);
      slot.appendChild(icon);
    }

    container.appendChild(slot);
  }

  document.getElementById('btn-brew').disabled = state.selected.length === 0;
}

/** Re-render the three target cards on the right. */
function renderTargets() {
  const list = document.getElementById('target-list');
  list.innerHTML = '';
  const canApply = state.currentPotion !== null;

  for (const target of TARGETS) {
    const effectId = state.targetEffects[target.id];
    const card = document.createElement('div');
    card.className = 'target-card'
      + (effectId ? ' fx-' + effectId : '')
      + (canApply ? '' : ' t-disabled');

    card.innerHTML = `
      <span class="t-visual">${target.icon}</span>
      <span class="t-name">${target.name}</span>
      <span class="t-status">${getTargetStatus(target.id)}</span>`;

    if (canApply) card.addEventListener('click', () => applyPotion(target.id));
    list.appendChild(card);
  }
}

/** One-liner description of the active effect on a target. */
function getTargetStatus(targetId) {
  const eid = state.targetEffects[targetId];
  if (!eid) return 'Unberührt';
  const e = EFFECTS.find(x => x.id === eid);
  return e ? `${e.icon} ${e.name}` : '';
}

/** Re-render the quest strip at the top. */
function renderQuests() {
  const list = document.getElementById('quest-list');
  list.innerHTML = '';
  for (const q of QUESTS) {
    const done = state.completedQuests.includes(q.id);
    const div = document.createElement('div');
    div.className = 'quest-card' + (done ? ' done' : '');
    div.innerHTML = `<span class="q-title">${done ? '✅ ' : ''}${q.title}</span><span class="q-desc">${q.desc}</span>`;
    list.appendChild(div);
  }
}

/** Update the potion-info panel in the centre. */
function renderPotionInfo() {
  const panel = document.getElementById('potion-info');
  if (!state.currentPotion) {
    panel.innerHTML = `<p style="color:var(--text-muted);font-style:italic;font-size:0.84em;">
      Wähle Zutaten und braue einen Trank...</p>`;
    return;
  }
  const e = state.currentPotion;
  panel.innerHTML = `
    <span class="p-icon">${e.icon}</span>
    <span class="p-name">${e.name}</span>
    <span class="p-desc">${e.desc}</span>
    <span class="p-hint">→ Klicke ein Ziel, um den Trank anzuwenden!</span>`;
}

/** Full re-render of all dynamic parts. */
function renderAll() {
  renderIngredients();
  renderSlots();
  renderTargets();
  renderQuests();
  renderPotionInfo();
}

// ============================================================
// GAME ACTIONS
// ============================================================

/** Select or deselect an ingredient. */
function toggleIngredient(id) {
  const idx = state.selected.indexOf(id);
  if (idx !== -1) {
    state.selected.splice(idx, 1);
  } else if (state.selected.length < 3) {
    state.selected.push(id);
  }
  state.currentPotion = null; // changing ingredients clears brewed potion
  renderAll();
}

/** Remove the ingredient in a specific slot index. */
function removeSlot(i) {
  state.selected.splice(i, 1);
  state.currentPotion = null;
  renderAll();
}

/** Brew: animate the cauldron then resolve the effect. */
function brew() {
  if (state.selected.length === 0) return;

  const body = document.getElementById('cauldron-body');
  body.classList.add('brewing');
  setTimeout(() => body.classList.remove('brewing'), 1800);

  setTimeout(() => {
    const effect = matchEffect(state.selected);
    state.currentPotion = effect;

    // Change cauldron liquid colour to match the potion
    document.getElementById('cauldron-liquid').style.background =
      `radial-gradient(ellipse, ${effect.liquidColor}cc, ${effect.liquidColor})`;

    // Record in recipe book if it is a new combination
    const key = [...state.selected].sort().join('+');
    const alreadyKnown = state.discovered.some(r => r.key === key && r.effectId === effect.id);
    if (!alreadyKnown) {
      state.discovered.push({ key, effectId: effect.id, ingredients: [...state.selected] });
      toast(`📖 Neues Rezept: ${effect.icon} ${effect.name}!`);
    }

    renderPotionInfo();
    renderTargets(); // enable target clicking
  }, 900);
}

/** Apply the brewed potion to a chosen target. */
function applyPotion(targetId) {
  if (!state.currentPotion) return;
  const effect = state.currentPotion;
  const targetName = TARGETS.find(t => t.id === targetId).name;

  state.targetEffects[targetId] = effect.id;
  checkQuests(effect.id, targetId);

  // Reset brewing state
  state.selected = [];
  state.currentPotion = null;
  // Reset cauldron liquid colour
  document.getElementById('cauldron-liquid').style.background = '';

  renderAll();
  toast(`${effect.icon} ${effect.name} wirkt auf ${targetName}!`);
}

/** Check if any quest requirement is now fulfilled. */
function checkQuests(effectId, targetId) {
  for (const q of QUESTS) {
    if (state.completedQuests.includes(q.id)) continue;
    const effectOk = q.req.effectId === effectId;
    const targetOk = q.req.targetId === null || q.req.targetId === targetId;
    if (effectOk && targetOk) {
      state.completedQuests.push(q.id);
      setTimeout(() => toast(`✅ Auftrag erfüllt: ${q.title}\n🎁 ${q.reward}`, 3500), 1000);
    }
  }
}

// ============================================================
// RECIPE BOOK
// ============================================================

function openBook() {
  const grid = document.getElementById('recipe-grid');
  grid.innerHTML = '';

  if (state.discovered.length === 0) {
    grid.innerHTML = '<div class="empty-book">Noch keine Rezepte entdeckt.<br>Braue deinen ersten Trank!</div>';
  } else {
    for (const rec of state.discovered) {
      const effect = EFFECTS.find(e => e.id === rec.effectId);
      if (!effect) continue;
      const icons = rec.ingredients.map(id => INGREDIENTS.find(i => i.id === id)?.icon ?? '?').join(' + ');
      const names = rec.ingredients.map(id => INGREDIENTS.find(i => i.id === id)?.name ?? '?').join(' + ');
      const entry = document.createElement('div');
      entry.className = 'recipe-entry';
      entry.style.borderColor = effect.liquidColor + '99';
      entry.innerHTML = `
        <div class="re-icon">${effect.icon}</div>
        <div class="re-name">${effect.name}</div>
        <div class="re-ingredients">${icons}</div>
        <div class="re-ingredients">${names}</div>`;
      grid.appendChild(entry);
    }
  }

  document.getElementById('book-modal').classList.remove('hidden');
}

function closeBook() {
  document.getElementById('book-modal').classList.add('hidden');
}

// ============================================================
// TOAST NOTIFICATION
// ============================================================

let toastTimer = null;

function toast(msg, duration = 2600) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), duration);
}

// ============================================================
// INIT
// ============================================================

document.getElementById('btn-book').addEventListener('click', openBook);
document.getElementById('btn-brew').addEventListener('click', brew);
document.getElementById('btn-close').addEventListener('click', closeBook);

// Close modal by clicking the backdrop
document.getElementById('book-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('book-modal')) closeBook();
});

renderAll();

</script>
